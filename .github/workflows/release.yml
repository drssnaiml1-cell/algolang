name: Release

# Push a tag like v0.2.1 and this publishes a GitHub Release with the wheel, sdist,
# the full source zip and the PDF manuals. See DEVELOPER_GUIDE.md §3.2.
# No tag yet? Actions → Release → Run workflow → type the version (e.g. v0.3.1):
# the tag is created on the selected branch and the release is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.3.1 (created on the selected branch if the tag does not exist yet)"
        required: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use the existing tag, if there is one
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/${{ github.event.inputs.tag }}" >/dev/null; then
            git checkout "${{ github.event.inputs.tag }}"
          else
            echo "Tag ${{ github.event.inputs.tag }} does not exist yet; it will be created at $(git rev-parse --short HEAD)"
          fi
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Version in the tag must match the code
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE="v$(python -c 'import algoruntime; print(algoruntime.VERSION)')"
          echo "tag=$TAG code=$CODE"
          test "$TAG" = "$CODE" || { echo "::error::tag $TAG does not match algoruntime.VERSION ($CODE)"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]" && python -m pytest -m "not slow"
      - name: Build wheel and sdist
        run: python -m build
      - name: Build the source zip (what install.bat / install.sh expect)
        run: git archive --format=zip --prefix=algolang/ -o "dist/AlgoLang_v${VER}.zip" HEAD
      - name: Collect manuals and notebook
        run: |
          cp docs/AlgoLang_Documentation_v*.pdf docs/AlgoLang_50_Sample_Programs.pdf slides/AlgoLang_Presentation.pdf AlgoLang_Notebook.ipynb dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ["VER"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(ver)}\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "See CHANGELOG.md.") + (
              "\n\n### Install\n```bash\npip install algolang-" + ver + "-py3-none-any.whl\n"
              "# or\npip install \"git+https://github.com/${{ github.repository }}@v" + ver + "\"\n```\n"
              "Or download `AlgoLang_v" + ver + ".zip`, unzip it and run `install.bat` (Windows) or `bash install.sh` (Linux/macOS).")
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body)
          PY
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: AlgoLang ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: dist/*

  # To publish on PyPI: set up a trusted publisher for this repository on pypi.org, then uncomment.
