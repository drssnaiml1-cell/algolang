name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  NO_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff + every .algo file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Compile-check every example and domain pack
        run: python algoc.py dev lint examples packs enterprise-apps
      - name: Behaviour specs (tests/specs/*.algotest.json, offline and deterministic)
        run: python algoc.py dev test tests/specs
      - name: Enterprise applications (11 apps · tests + batch + streams + audit verification + system cards)
        run: python enterprise-apps/run_all.py --batch
      - name: README figures match the programs (tools/make_figures.py)
        run: |
          python tools/make_figures.py > /dev/null
          git diff --exit-code --stat -- docs/images || { echo "::error::figures are out of date: run python tools/make_figures.py and commit"; exit 1; }

  test:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build (3.9 is end-of-life);
          # keep testing the documented minimum on 24.04.
          - {os: ubuntu-24.04, python: "3.9"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  pulse:
    name: Real-time streams · AlgoPulse server
    needs: lint
    runs-on: ubuntu-latest
    env:
      ALGO_PULSE_TOKEN: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Start an AlgoPulse server
        run: |
          python algoc.py pulse serve --dir "$RUNNER_TEMP/pulse" --port 7070 > "$RUNNER_TEMP/pulse.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -H "Authorization: Bearer $ALGO_PULSE_TOKEN" http://127.0.0.1:7070/health && break; sleep 1; done
      - name: Stream tests, including the served-bus round trip
        env: {ALGO_PULSE_TEST_URL: "http://127.0.0.1:7070"}
        run: python -m pytest tests/test_stream.py -v
      - name: Trading desk order flow over the server
        working-directory: enterprise-apps/algo-trading-desk
        env: {ALGO_PULSE_URL: "http://127.0.0.1:7070"}
        run: |
          python ../../algoc.py stream programs/pre_trade_check.algo --pulse --produce data/order_events.jsonl
          python ../../algoc.py stream programs/pre_trade_check.algo --pulse --max 6 --idle 20
          python ../../algoc.py pulse topics
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/pulse.log"

  trust:
    name: Trustworthy AI · evidence for every application
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Trust tests with the built-in Ed25519 (no cryptography package)
        run: |
          pip uninstall -y cryptography || true
          python -m pytest tests/test_trust.py -v
      - name: Trust report for all eleven applications (fairness, robustness, oversight, signed audit …)
        run: |
          for app in enterprise-apps/*/; do
            [ -d "$app/programs" ] || continue
            (cd "$app" && python ../../algoc.py trust report programs --html "$RUNNER_TEMP/trust-$(basename $app).html")
          done
      - name: Signed evidence packs for the high-risk programs, verified, then tampered with
        run: |
          set -e
          for p in bank-credit-onboarding:loan_decision university-admissions-obe:admissions \
                   hospital-care-coordination:er_triage citizen-services-desk:welfare_check; do
            app=${p%%:*}; prog=${p##*:}
            cd "enterprise-apps/$app"
            python ../../algoc.py evidence export "programs/$prog.algo" --out "$RUNNER_TEMP/$prog.evidence.zip"
            python ../../algoc.py evidence verify "$RUNNER_TEMP/$prog.evidence.zip"
            python - "$RUNNER_TEMP/$prog.evidence.zip" <<'PY'
          import sys, zipfile
          src = sys.argv[1]; bad = src.replace(".zip", ".tampered.zip")
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(bad, "w") as zout:
              for n in zin.namelist():
                  d = zin.read(n)
                  zout.writestr(n, d.replace(b"require approvals 2", b"require approvals 1").replace(b"for always", b"when confidence < 0.1"))
          PY
            ! python ../../algoc.py evidence verify "${RUNNER_TEMP}/$prog.evidence.tampered.zip"
            cd ../..
          done
      - uses: actions/upload-artifact@v4
        with:
          name: trust-reports
          path: |
            ${{ runner.temp }}/trust-*.html
            ${{ runner.temp }}/*.evidence.zip

  quantum:
    name: Quantum tools · cross-checked against Qiskit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,quantum]" qiskit qiskit-aer
      - name: Simulator, QAOA verification, Grover and policies (with the Qiskit cross-check enabled)
        run: python -m pytest tests/test_quantum.py tests/test_quantum_apps.py tests/test_quantum_ai.py -v
      - name: Quantum AI Lab evals (v0.6, noisy simulator)
        working-directory: enterprise-apps/quantum-ai-lab
        run: python ../../algoc.py eval programs/quantum_ai.algo
      - name: The hardware path's QAOA and VQE circuits give the same state on Qiskit Aer (v0.6)
        run: |
          python - <<'PY'
          import numpy as np, algoqpu as Q, algoquantum as aq
          from qiskit import QuantumCircuit
          from qiskit.quantum_info import Statevector
          rng = np.random.default_rng(3)
          for n in (3, 4, 5):
              Qm = rng.normal(size=(n, n))
              costs, _ = aq.qubo_costs(Qm)
              ops = Q.qaoa_ops(Qm, [0.3, 0.7], [0.45, 0.2], costs.max() - costs.min(), np)
              ours = Q.statevector(n, ops).probabilities()
              qc = QuantumCircuit.from_qasm_str(Q.ops_to_qasm(n, ops, measure=False))
              aer = Statevector.from_instruction(qc).probabilities()
              assert np.allclose(ours, aer, atol=1e-9), n
              ans = Q.ansatz_ops(n, list(rng.uniform(-1, 1, n * 3)), 2)
              qc2 = QuantumCircuit.from_qasm_str(Q.ops_to_qasm(n, ans, measure=False))
              assert np.allclose(Q.statevector(n, ans).probabilities(), Statevector.from_instruction(qc2).probabilities())
          print("QAOA and VQE circuits agree with Qiskit")
          PY
      - name: Quantum Optimization Lab evals
        working-directory: enterprise-apps/quantum-optimization-lab
        run: |
          python ../../algoc.py eval programs/portfolio_optimizer.algo
          python ../../algoc.py eval programs/shift_scheduler.algo
          python ../../algoc.py eval programs/audit_sampling.algo
          python ../../algoc.py eval programs/circuit_lab.algo
          python ../../algoc.py quantum export programs/circuit_lab.algo --out "$RUNNER_TEMP/qasm"
      - name: The other quantum applications (v0.3.3)
        run: |
          (cd enterprise-apps/soc-incident-command && python ../../algoc.py eval programs/pqc_readiness.algo)
          (cd enterprise-apps/algo-trading-desk && python ../../algoc.py eval programs/risk_scenarios.algo)
          (cd enterprise-apps/supply-chain-control-tower && python ../../algoc.py eval programs/route_optimizer.algo)
      - name: Exported circuits run unchanged on Qiskit Aer
        run: |
          python - <<'PY'
          import glob, os
          from qiskit import QuantumCircuit, transpile
          from qiskit_aer import AerSimulator
          sim = AerSimulator(seed_simulator=1)
          for f in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "qasm", "*.qasm"))):
              qc = QuantumCircuit.from_qasm_file(f)
              counts = sim.run(transpile(qc, sim), shots=1000).result().get_counts()
              print(os.path.basename(f), counts)
              if f.endswith("Grover2.qasm"):
                  assert counts == {"11": 1000}
              if f.endswith("Bell.qasm"):
                  assert set(counts) == {"00", "11"}
          PY
      - name: Same Bell circuit on the built-in simulator and on Qiskit Aer
        run: |
          python - <<'PY'
          import algoruntime as rt, algoquantum as aq
          bell = 'OPENQASM 2.0; include "qelib1.inc"; qreg q[2]; creg c[2]; h q[0]; cx q[0],q[1]; measure q -> c;'
          a = aq.run_qasm(bell)["counts"]
          rt.load_config()["quantum"]["backend"] = "qiskit-aer"
          b = aq.run_qasm(bell)["counts"]
          print("simulator", a, "| qiskit-aer", b)
          assert set(a) == set(b) == {"00", "11"}
          PY

  package:
    name: Wheel builds and installs cleanly
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - name: Install the wheel in a fresh venv and smoke-test it outside the source tree
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/v/bin/algo doctor
          /tmp/v/bin/algo domains "triage insurance claims"
          /tmp/v/bin/algo run pack:insurance.claims_triage --arg "claim=Rear-end collision, bumper damage"
          /tmp/v/bin/algo audit verify runs
          # v0.3: eval blocks, an MCP server and cost/energy budgets, from the installed wheel
          cp -r "$(/tmp/v/bin/python -c 'import algolang; print(algolang.HOME)')/examples/v03" v03 && cd v03
          /tmp/v/bin/algo eval expense_desk.algo
          /tmp/v/bin/algo eval expense_desk.algo --replay
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  notebook:
    name: Notebook runs top to bottom
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Execute AlgoLang_Notebook.ipynb in a clean folder (as Colab would)
        run: |
          mkdir "$RUNNER_TEMP/nb" && cp AlgoLang_Notebook.ipynb "$RUNNER_TEMP/nb/" && cd "$RUNNER_TEMP/nb"
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          nb = nbformat.read("AlgoLang_Notebook.ipynb", 4)
          NotebookClient(nb, timeout=180, kernel_name="python3").execute()
          print("notebook OK:", sum(c.cell_type == "code" for c in nb.cells), "code cells")
          PY

  site:
    name: Website builds
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e . markdown pillow
      - run: python tools/build_site.py
