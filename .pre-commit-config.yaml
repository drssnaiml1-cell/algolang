repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: algolang-lint
        name: algo dev lint
        entry: python algoc.py dev lint examples packs
        language: system
        pass_filenames: false
        files: \.algo$
