# AlgoLang real-time stack: Apache ZooKeeper + Apache Kafka (single broker, for development and CI).
#
#   docker compose -f deploy/kafka/docker-compose.yml up -d
#   cd enterprise-apps/algo-trading-desk
#   algo stream programs/pre_trade_check.algo --kafka --produce data/order_events.jsonl
#   algo stream programs/pre_trade_check.algo --kafka
#
# ZooKeeper keeps the cluster metadata (brokers, topics, controller election); Kafka stores the events.
# Confluent Platform 7.6 ships Apache Kafka 3.6, the line that still supports ZooKeeper mode.
# Apache Kafka 4.0 removed ZooKeeper; for new production clusters use docker-compose.kraft.yml.
# AlgoLang streams work the same on both, because clients only talk to the brokers.
name: algolang-kafka

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 10s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # one listener for other containers (kafka:29092), one for programs on your machine (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # topics are created explicitly below
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  topics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders.intent:6 orders.decisions:6 orders.review:3 orders.dlq:1 soc.alerts:3 soc.incidents:3 soc.dlq:1; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:29092 --list
    restart: "no"
