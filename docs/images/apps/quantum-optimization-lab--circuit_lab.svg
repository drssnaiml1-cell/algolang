<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 452" width="1280" height="452" role="img" aria-label="Circuit lab">
  <title>Circuit lab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
