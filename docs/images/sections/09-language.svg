<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 324" width="1280" height="324" role="img" aria-label="From .algo source to a governed run">
  <title>From .algo source to a governed run</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="324" fill="url(#bg)"/>
  <rect width="1280" height="324" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">9 · THE LANGUAGE</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">From .algo source to a governed run</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">One small grammar; the compiler proves the rules before the runtime executes them.</text>
  
<g class="rise" style="animation-delay:0.00s">
<rect x="40.0" y="132" width="203.2" height="152" rx="12" class="card"/>
<circle cx="64.0" cy="158" r="15" fill="url(#gold)"/><text x="64.0" y="163" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">1</text>
<text x="86.0" y="163" fill="#f4f1e8" font-size="15.5" font-weight="700">Source</text>
<text x="56.0" y="192" fill="#c9b98a" font-size="13">model, tool, agent,</text>
<text x="56.0" y="210" fill="#c9b98a" font-size="13">flow, stream, circuit</text>
<text x="56.0" y="228" fill="#c9b98a" font-size="13">and eval declarations</text>
<text x="56.0" y="270" fill="#e9c75a" font-size="12" class="mono">.algo</text>
</g>
<g class="rise" style="animation-delay:0.12s">
<rect x="289.2" y="132" width="203.2" height="152" rx="12" class="card"/>
<circle cx="313.2" cy="158" r="15" fill="url(#gold)"/><text x="313.2" y="163" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">2</text>
<text x="335.2" y="163" fill="#f4f1e8" font-size="15.5" font-weight="700">Parse</text>
<text x="305.2" y="192" fill="#c9b98a" font-size="13">Lark grammar to an</text>
<text x="305.2" y="210" fill="#c9b98a" font-size="13">abstract syntax tree,</text>
<text x="305.2" y="228" fill="#c9b98a" font-size="13">with file and line for</text>
<text x="305.2" y="246" fill="#c9b98a" font-size="13">every node</text>
<text x="305.2" y="270" fill="#e9c75a" font-size="12" class="mono">grammar.lark</text>
</g>
<g class="rise" style="animation-delay:0.24s">
<rect x="538.4" y="132" width="203.2" height="152" rx="12" class="card"/>
<circle cx="562.4" cy="158" r="15" fill="url(#gold)"/><text x="562.4" y="163" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">3</text>
<text x="584.4" y="163" fill="#f4f1e8" font-size="15.5" font-weight="700">Check</text>
<text x="554.4" y="192" fill="#c9b98a" font-size="13">34 rules: agents only,</text>
<text x="554.4" y="210" fill="#c9b98a" font-size="13">declared tools, types,</text>
<text x="554.4" y="228" fill="#c9b98a" font-size="13">risk-level safeguards,</text>
<text x="554.4" y="246" fill="#c9b98a" font-size="13">locked packages</text>
<text x="554.4" y="270" fill="#e9c75a" font-size="12" class="mono">E100–E133</text>
</g>
<g class="rise" style="animation-delay:0.36s">
<rect x="787.6" y="132" width="203.2" height="152" rx="12" class="card"/>
<circle cx="811.5999999999999" cy="158" r="15" fill="url(#gold)"/><text x="811.5999999999999" y="163" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">4</text>
<text x="833.6" y="163" fill="#f4f1e8" font-size="15.5" font-weight="700">Generate</text>
<text x="803.6" y="192" fill="#c9b98a" font-size="13">Plain Python that calls</text>
<text x="803.6" y="210" fill="#c9b98a" font-size="13">the runtime; readable</text>
<text x="803.6" y="228" fill="#c9b98a" font-size="13">and testable</text>
<text x="803.6" y="270" fill="#e9c75a" font-size="12" class="mono">algoc.py</text>
</g>
<g class="rise" style="animation-delay:0.48s">
<rect x="1036.8" y="132" width="203.2" height="152" rx="12" class="card"/>
<circle cx="1060.8" cy="158" r="15" fill="url(#gold)"/><text x="1060.8" y="163" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">5</text>
<text x="1082.8" y="163" fill="#f4f1e8" font-size="15.5" font-weight="700">Run</text>
<text x="1052.8" y="192" fill="#c9b98a" font-size="13">Policies, budgets,</text>
<text x="1052.8" y="210" fill="#c9b98a" font-size="13">sampling, human gate</text>
<text x="1052.8" y="228" fill="#c9b98a" font-size="13">and audit for every</text>
<text x="1052.8" y="246" fill="#c9b98a" font-size="13">agent call</text>
<text x="1052.8" y="270" fill="#e9c75a" font-size="12" class="mono">algoruntime.py</text>
</g>
<path id="p0" d="M247.2 208.0 L285.2 208.0" class="wire"/>
<path d="M278.2 203.0 L285.2 208.0 L278.2 213.0" fill="none" stroke="#c9a227" stroke-width="2"/>
<path id="p1" d="M496.4 208.0 L534.4 208.0" class="wire"/>
<path d="M527.4 203.0 L534.4 208.0 L527.4 213.0" fill="none" stroke="#c9a227" stroke-width="2"/>
<path id="p2" d="M745.6 208.0 L783.6 208.0" class="wire"/>
<path d="M776.6 203.0 L783.6 208.0 L776.6 213.0" fill="none" stroke="#c9a227" stroke-width="2"/>
<path id="p3" d="M994.8 208.0 L1032.8 208.0" class="wire"/>
<path d="M1025.8 203.0 L1032.8 208.0 L1025.8 213.0" fill="none" stroke="#c9a227" stroke-width="2"/>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.1s" begin="0.00s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.1s" begin="0.35s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.1s" begin="0.70s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.1s" begin="1.05s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <text x="1240" y="310" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
