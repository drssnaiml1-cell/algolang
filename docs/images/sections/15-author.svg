<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 266" width="1280" height="266" role="img" aria-label="Designed in Hyderabad by AlgoProfessor AI R&amp;D Solutions">
  <title>Designed in Hyderabad by AlgoProfessor AI R&amp;D Solutions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="266" fill="url(#bg)"/>
  <rect width="1280" height="266" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">15 · AUTHOR AND LICENCE</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">Designed in Hyderabad by AlgoProfessor AI R&amp;D Solutions</text>
  
  
<g class="rise" style="animation-delay:0.00s">
<rect x="40.0" y="100" width="388.0" height="118" rx="12" class="card"/>
<rect x="40.0" y="100" width="388.0" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.00s"/>
<circle cx="66.0" cy="128" r="15" fill="url(#gold)"/><text x="66.0" y="133" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">✦</text>
<text x="90.0" y="133" fill="#f4f1e8" font-size="16" font-weight="700">Dr. S. Satyanarayana</text>
<text x="58.0" y="162" fill="#c9b98a" font-size="13.5">Ph.D., PDF (AI) · Founder, CEO &amp; Chief Agentic</text>
<text x="58.0" y="181" fill="#c9b98a" font-size="13.5">AI Scientist</text>
</g>
<g class="rise" style="animation-delay:0.08s">
<rect x="446.0" y="100" width="388.0" height="118" rx="12" class="card"/>
<rect x="446.0" y="100" width="388.0" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.12s"/>
<circle cx="472.0" cy="128" r="15" fill="url(#gold)"/><text x="472.0" y="133" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">✦</text>
<text x="496.0" y="133" fill="#f4f1e8" font-size="16" font-weight="700">AlgoProfessor AI R&amp;D</text>
<text x="464.0" y="162" fill="#c9b98a" font-size="13.5">www.algoprofessor.com · ceo@algoprofessor.com</text>
</g>
<g class="rise" style="animation-delay:0.16s">
<rect x="852.0" y="100" width="388.0" height="118" rx="12" class="card"/>
<rect x="852.0" y="100" width="388.0" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.24s"/>
<circle cx="878.0" cy="128" r="15" fill="url(#gold)"/><text x="878.0" y="133" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">✦</text>
<text x="902.0" y="133" fill="#f4f1e8" font-size="16" font-weight="700">Apache License 2.0</text>
<text x="870.0" y="162" fill="#c9b98a" font-size="13.5">Open source. Contributions welcome:</text>
<text x="870.0" y="181" fill="#c9b98a" font-size="13.5">CONTRIBUTING.md and the Code of Conduct.</text>
