<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 586" width="1280" height="586" role="img" aria-label="Defence in depth for every agent call">
  <title>Defence in depth for every agent call</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="586" fill="url(#bg)"/>
  <rect width="1280" height="586" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">10 · GOVERNANCE</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">Defence in depth for every agent call</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">Each layer can stop a call; every outcome, allowed or blocked, is written to the signed audit chain.</text>
  
<path id="drop" d="M1190 120 L1190 540" class="wire"/>
<g class="rise" style="animation-delay:0.00s">
<rect x="40" y="126" width="1100" height="58" rx="10" class="card"/>
<rect x="40" y="126" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="62" y="151" fill="#f4f1e8" font-size="16" font-weight="700">Organisation policy</text>
<text x="62" y="172" fill="#c9b98a" font-size="13.5">forbidden attributes, allowed tools, caps, review threshold, pinned MCP servers</text>
<text x="1120" y="161" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">algo.config.json</text>
</g>
<g class="rise" style="animation-delay:0.10s">
<rect x="58" y="196" width="1064" height="58" rx="10" class="card"/>
<rect x="58" y="196" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="80" y="221" fill="#f4f1e8" font-size="16" font-weight="700">Compile-time checks</text>
<text x="80" y="242" fill="#c9b98a" font-size="13.5">unsafe programs never start; high-risk programs must carry every safeguard</text>
<text x="1102" y="231" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">E100–E133</text>
</g>
<g class="rise" style="animation-delay:0.20s">
<rect x="76" y="266" width="1028" height="58" rx="10" class="card"/>
<rect x="76" y="266" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="98" y="291" fill="#f4f1e8" font-size="16" font-weight="700">Privacy and fencing</text>
<text x="98" y="312" fill="#c9b98a" font-size="13.5">personal data masked, protected values withheld, untrusted tool output fenced</text>
<text x="1084" y="301" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">redact pii</text>
</g>
<g class="rise" style="animation-delay:0.30s">
<rect x="94" y="336" width="992" height="58" rx="10" class="card"/>
<rect x="94" y="336" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="116" y="361" fill="#f4f1e8" font-size="16" font-weight="700">Budgets and sampling</text>
<text x="116" y="382" fill="#c9b98a" font-size="13.5">tokens, $, ₹ and Wh priced before the call; uncertain agents sampled</text>
<text x="1066" y="371" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">samples 5</text>
</g>
<g class="rise" style="animation-delay:0.40s">
<rect x="112" y="406" width="956" height="58" rx="10" class="card"/>
<rect x="112" y="406" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="134" y="431" fill="#f4f1e8" font-size="16" font-weight="700">Explanation and people</text>
<text x="134" y="452" fill="#c9b98a" font-size="13.5">grounded reasons with evidence; review queue with four-eyes approval</text>
<text x="1048" y="441" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">require approvals 2</text>
</g>
<g class="rise" style="animation-delay:0.50s">
<rect x="130" y="476" width="920" height="58" rx="10" class="card"/>
<rect x="130" y="476" width="6" height="58" rx="3" fill="url(#gold)"/>
<text x="152" y="501" fill="#f4f1e8" font-size="16" font-weight="700">Signed audit</text>
<text x="152" y="522" fill="#c9b98a" font-size="13.5">Ed25519 signatures over a SHA-256 chain; retention keeps it verifiable</text>
<text x="1030" y="511" fill="#e9c75a" font-size="13" text-anchor="end" class="mono">algo audit verify</text>
</g>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="3.2s" begin="0.00s" repeatCount="indefinite"><mpath href="#drop"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="3.2s" begin="1.60s" repeatCount="indefinite"><mpath href="#drop"/></animateMotion></circle>
<text x="1190" y="112" fill="#e9c75a" font-size="12" text-anchor="middle">every call</text>
  <text x="1240" y="572" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
