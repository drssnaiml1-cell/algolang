<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 455" width="1280" height="455" role="img" aria-label="From install to a governed multi-agent run in minutes">
  <title>From install to a governed multi-agent run in minutes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .tl { animation: type 9.3s ease-out infinite both; } @keyframes type { 0% { opacity: 0; } 3% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { .tl { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="455" fill="url(#bg)"/>
  <rect width="1280" height="455" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">4 · GET STARTED</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">From install to a governed multi-agent run in minutes</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">Offline by default: no API key needed until you add --live.</text>
  
<rect x="40" y="112" width="1200" height="309" rx="12" fill="#050d1d" stroke="#c9a227" stroke-opacity=".5"/>
<circle cx="64" cy="132" r="6" fill="#e0705c"/><circle cx="84" cy="132" r="6" fill="#e9c75a"/><circle cx="104" cy="132" r="6" fill="#6cc28a"/>
<text x="126" y="137" fill="#7f8db0" font-size="13" class="mono">algo — enterprise quick start</text>
<text x="64" y="172" font-size="15" class="mono tl" style="animation-delay:0.00s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">pip install git+https://github.com/drssnaiml1-cell/algolang</tspan><tspan fill="#6f7d9e">   # once</tspan></text>
<text x="64" y="199" font-size="15" class="mono tl" style="animation-delay:0.70s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo init acme &amp;&amp; cd acme</tspan><tspan fill="#6f7d9e">   # config, tools, knowledge base, sample program</tspan></text>
<text x="64" y="226" font-size="15" class="mono tl" style="animation-delay:1.40s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo domains &quot;triage insurance claims&quot;</tspan><tspan fill="#6f7d9e">   # search 120 domain packs</tspan></text>
<text x="64" y="253" font-size="15" class="mono tl" style="animation-delay:2.10s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo run pack:insurance.claims_triage --arg &quot;claim=Rear-end collision&quot;</tspan></text>
<text x="64" y="280" font-size="15" class="mono tl" style="animation-delay:2.80s" xml:space="preserve"><tspan fill="#6cc28a">→ ok · 4 agents · confidence 0.86 · audit chain intact</tspan></text>
<text x="64" y="307" font-size="15" class="mono tl" style="animation-delay:3.50s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo batch programs/claims_ops.algo --input data/claims.csv --workers 16</tspan></text>
<text x="64" y="334" font-size="15" class="mono tl" style="animation-delay:4.20s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo review</tspan><tspan fill="#6f7d9e">   # human review queue</tspan></text>
<text x="64" y="361" font-size="15" class="mono tl" style="animation-delay:4.90s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo audit verify</tspan><tspan fill="#6f7d9e">   # every hash chain checked</tspan></text>
<text x="64" y="388" font-size="15" class="mono tl" style="animation-delay:5.60s" xml:space="preserve"><tspan fill="#e9c75a">$ </tspan><tspan fill="#e8e4d8">algo studio</tspan><tspan fill="#6f7d9e">   # graphical mode  ·  algo ui = prompt mode</tspan></text>
<rect x="64" y="401" width="10" height="18" fill="#e9c75a" class="pulse"/>
  <text x="1240" y="441" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
