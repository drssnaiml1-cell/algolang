<text x="58.0" y="205" fill="#c9b98a" font-size="13.5">simulators; credentials from the</text>
<text x="58.0" y="224" fill="#c9b98a" font-size="13.5">environment.</text>
<text x="312.5" y="240" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">Q1</text>
