<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="AlgoLang 1.0: a platform teams can build on, share and deploy">
  <title>AlgoLang 1.0: a platform teams can build on, share and deploy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">3 · WHAT'S NEW IN V1.0</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">AlgoLang 1.0: a platform teams can build on, share and deploy</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">Every release planned since v0.1 has shipped; 1.0 adds the native runtime and the ecosystem around it.</text>
  
<g class="rise" style="animation-delay:0.00s">
<rect x="40.0" y="124" width="286.5" height="128" rx="12" class="card"/>
<rect x="40.0" y="124" width="286.5" height="128" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.00s"/>
<circle cx="66.0" cy="152" r="15" fill="url(#gold)"/><text x="66.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">1</text>
<text x="90.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Typed messages</text>
<text x="58.0" y="186" fill="#c9b98a" font-size="13.5">type Claim { … }: fields checked</text>
<text x="58.0" y="205" fill="#c9b98a" font-size="13.5">by the compiler and every answer</text>
<text x="58.0" y="224" fill="#c9b98a" font-size="13.5">validated.</text>
<text x="312.5" y="240" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">E131 · E132</text>
</g>
<g class="rise" style="animation-delay:0.08s">
<rect x="344.5" y="124" width="286.5" height="128" rx="12" class="card"/>
<rect x="344.5" y="124" width="286.5" height="128" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.12s"/>
<circle cx="370.5" cy="152" r="15" fill="url(#gold)"/><text x="370.5" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">2</text>
<text x="394.5" y="157" fill="#f4f1e8" font-size="16" font-weight="700">AlgoIR &amp; AlgoVM</text>
<text x="362.5" y="186" fill="#c9b98a" font-size="13.5">Signed, portable programs run on</text>
<text x="362.5" y="205" fill="#c9b98a" font-size="13.5">AlgoLang's own VM; no generated</text>
<text x="362.5" y="224" fill="#c9b98a" font-size="13.5">code.</text>
<text x="617.0" y="240" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">build --ir</text>
</g>
<g class="rise" style="animation-delay:0.16s">
<rect x="649.0" y="124" width="286.5" height="128" rx="12" class="card"/>
<rect x="649.0" y="124" width="286.5" height="128" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.24s"/>
<circle cx="675.0" cy="152" r="15" fill="url(#gold)"/><text x="675.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">3</text>
<text x="699.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Packages &amp; registry</text>
<text x="667.0" y="186" fill="#c9b98a" font-size="13.5">Signed .algopkg archives, semver,</text>
<text x="667.0" y="205" fill="#c9b98a" font-size="13.5">algo.lock, use &quot;pkg:…&quot;.</text>
<text x="921.5" y="240" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">algo pkg</text>
</g>
<g class="rise" style="animation-delay:0.24s">
<rect x="953.5" y="124" width="286.5" height="128" rx="12" class="card"/>
<rect x="953.5" y="124" width="286.5" height="128" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.36s"/>
<circle cx="979.5" cy="152" r="15" fill="url(#gold)"/><text x="979.5" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">4</text>
<text x="1003.5" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Studio SSO &amp; roles</text>
<text x="971.5" y="186" fill="#c9b98a" font-size="13.5">OpenID Connect sign-in; viewer,</text>
<text x="971.5" y="205" fill="#c9b98a" font-size="13.5">reviewer, author and admin roles.</text>
<text x="1226.0" y="240" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">OIDC · RBAC</text>
</g>
  <text x="1240" y="286" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
