<circle cx="979.5" cy="298" r="15" fill="url(#gold)"/><text x="979.5" y="303" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">8</text>
<text x="1003.5" y="303" fill="#f4f1e8" font-size="16" font-weight="700">Post-quantum audit</text>
