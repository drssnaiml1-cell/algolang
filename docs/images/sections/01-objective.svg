<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 426" width="1280" height="426" role="img" aria-label="Ten objectives, one aim: trustworthy agent systems">
  <title>Ten objectives, one aim: trustworthy agent systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="426" fill="url(#bg)"/>
  <rect width="1280" height="426" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">1 · OBJECTIVE</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">Ten objectives, one aim: trustworthy agent systems</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">Every objective is enforced by the compiler or the runtime, not left to good intentions.</text>
  
<g class="rise" style="animation-delay:0.00s">
<rect x="40.0" y="124" width="225.6" height="118" rx="12" class="card"/>
<rect x="40.0" y="124" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.00s"/>
<circle cx="66.0" cy="152" r="15" fill="url(#gold)"/><text x="66.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">1</text>
<text x="90.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Agent-native</text>
<text x="58.0" y="186" fill="#c9b98a" font-size="13.5">No functions: every task</text>
<text x="58.0" y="205" fill="#c9b98a" font-size="13.5">is an agent with role,</text>
<text x="58.0" y="224" fill="#c9b98a" font-size="13.5">goal, tools, model and …</text>
</g>
<g class="rise" style="animation-delay:0.08s">
<rect x="283.6" y="124" width="225.6" height="118" rx="12" class="card"/>
<rect x="283.6" y="124" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.12s"/>
<circle cx="309.6" cy="152" r="15" fill="url(#gold)"/><text x="309.6" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">2</text>
<text x="333.6" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Readable flows</text>
<text x="301.6" y="186" fill="#c9b98a" font-size="13.5">Call agents, run them in</text>
<text x="301.6" y="205" fill="#c9b98a" font-size="13.5">parallel, branch, emit.</text>
<text x="301.6" y="224" fill="#c9b98a" font-size="13.5">Nothing else.</text>
</g>
<g class="rise" style="animation-delay:0.16s">
<rect x="527.2" y="124" width="225.6" height="118" rx="12" class="card"/>
<rect x="527.2" y="124" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.24s"/>
<circle cx="553.2" cy="152" r="15" fill="url(#gold)"/><text x="553.2" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">3</text>
<text x="577.2" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Safe before run</text>
<text x="545.2" y="186" fill="#c9b98a" font-size="13.5">34 compile-time checks</text>
<text x="545.2" y="205" fill="#c9b98a" font-size="13.5">stop unsafe programs</text>
<text x="545.2" y="224" fill="#c9b98a" font-size="13.5">before any call.</text>
</g>
<g class="rise" style="animation-delay:0.24s">
<rect x="770.8" y="124" width="225.6" height="118" rx="12" class="card"/>
<rect x="770.8" y="124" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.36s"/>
<circle cx="796.8" cy="152" r="15" fill="url(#gold)"/><text x="796.8" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">4</text>
<text x="820.8" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Governance</text>
<text x="788.8" y="186" fill="#c9b98a" font-size="13.5">Budgets, retries,</text>
<text x="788.8" y="205" fill="#c9b98a" font-size="13.5">forbidden attributes and</text>
<text x="788.8" y="224" fill="#c9b98a" font-size="13.5">human review in the code.</text>
</g>
<g class="rise" style="animation-delay:0.32s">
<rect x="1014.4" y="124" width="225.6" height="118" rx="12" class="card"/>
<rect x="1014.4" y="124" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.48s"/>
<circle cx="1040.4" cy="152" r="15" fill="url(#gold)"/><text x="1040.4" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">5</text>
<text x="1064.4" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Accountability</text>
<text x="1032.4" y="186" fill="#c9b98a" font-size="13.5">Confidence, provenance</text>
<text x="1032.4" y="205" fill="#c9b98a" font-size="13.5">and an Ed25519-signed,</text>
<text x="1032.4" y="224" fill="#c9b98a" font-size="13.5">hash-chained audit log.</text>
</g>
<g class="rise" style="animation-delay:0.40s">
<rect x="40.0" y="260" width="225.6" height="118" rx="12" class="card"/>
<rect x="40.0" y="260" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.60s"/>
<circle cx="66.0" cy="288" r="15" fill="url(#gold)"/><text x="66.0" y="293" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">6</text>
<text x="90.0" y="293" fill="#f4f1e8" font-size="16" font-weight="700">Honest uncertainty</text>
<text x="58.0" y="322" fill="#c9b98a" font-size="13.5">uncertain&lt;T&gt; agents are</text>
<text x="58.0" y="341" fill="#c9b98a" font-size="13.5">sampled; decisions must</text>
<text x="58.0" y="360" fill="#c9b98a" font-size="13.5">check confidence.</text>
</g>
<g class="rise" style="animation-delay:0.48s">
<rect x="283.6" y="260" width="225.6" height="118" rx="12" class="card"/>
<rect x="283.6" y="260" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.72s"/>
<circle cx="309.6" cy="288" r="15" fill="url(#gold)"/><text x="309.6" y="293" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">7</text>
<text x="333.6" y="293" fill="#f4f1e8" font-size="16" font-weight="700">Cost and energy</text>
<text x="301.6" y="322" fill="#c9b98a" font-size="13.5">Every call priced in $,</text>
<text x="301.6" y="341" fill="#c9b98a" font-size="13.5">₹, watt-hours and CO₂</text>
<text x="301.6" y="360" fill="#c9b98a" font-size="13.5">before it runs.</text>
</g>
<g class="rise" style="animation-delay:0.56s">
<rect x="527.2" y="260" width="225.6" height="118" rx="12" class="card"/>
<rect x="527.2" y="260" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.84s"/>
<circle cx="553.2" cy="288" r="15" fill="url(#gold)"/><text x="553.2" y="293" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">8</text>
<text x="577.2" y="293" fill="#f4f1e8" font-size="16" font-weight="700">Reuse at scale</text>
<text x="545.2" y="322" fill="#c9b98a" font-size="13.5">120 domain packs,</text>
<text x="545.2" y="341" fill="#c9b98a" font-size="13.5">modules, MCP, AlgoPulse</text>
<text x="545.2" y="360" fill="#c9b98a" font-size="13.5">streams, quantum tools.</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="770.8" y="260" width="225.6" height="118" rx="12" class="card"/>
<rect x="770.8" y="260" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.96s"/>
<circle cx="796.8" cy="288" r="15" fill="url(#gold)"/><text x="796.8" y="293" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">9</text>
<text x="820.8" y="293" fill="#f4f1e8" font-size="16" font-weight="700">For everyone</text>
<text x="788.8" y="322" fill="#c9b98a" font-size="13.5">CLI, Studio, Prompt UI,</text>
<text x="788.8" y="341" fill="#c9b98a" font-size="13.5">Python SDK and editor</text>
<text x="788.8" y="360" fill="#c9b98a" font-size="13.5">support.</text>
</g>
<g class="rise" style="animation-delay:0.72s">
<rect x="1014.4" y="260" width="225.6" height="118" rx="12" class="card"/>
<rect x="1014.4" y="260" width="225.6" height="118" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:1.08s"/>
<circle cx="1040.4" cy="288" r="15" fill="url(#gold)"/><text x="1040.4" y="293" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">10</text>
<text x="1064.4" y="293" fill="#f4f1e8" font-size="16" font-weight="700">Trustworthy by evi…</text>
<text x="1032.4" y="322" fill="#c9b98a" font-size="13.5">Risk levels, fairness and</text>
<text x="1032.4" y="341" fill="#c9b98a" font-size="13.5">robustness tests, system</text>
<text x="1032.4" y="360" fill="#c9b98a" font-size="13.5">cards, trust reports.</text>
</g>
  <text x="1240" y="412" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
