<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 434" width="1280" height="434" role="img" aria-label="What lives where">
  <title>What lives where</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081428"/><stop offset=".6" stop-color="#0e2140"/><stop offset="1" stop-color="#132c55"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#e9c75a"/><stop offset="1" stop-color="#c9a227"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .wire { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .ctl { fill: none; stroke: #8fd3ff; stroke-opacity: .55; stroke-width: 1.4; stroke-dasharray: 3 5; animation: dash 2.2s linear infinite; }
    .card { fill: #0f2547; stroke: #c9a227; stroke-opacity: .75; stroke-width: 1.4; }
    .glow { animation: glow 3.6s ease-in-out infinite; }
    .rise { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .fade { opacity: 0; animation: fade 7s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes fade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>
  <rect width="1280" height="434" fill="url(#bg)"/>
  <rect width="1280" height="434" fill="url(#grid)"/>
  <rect width="1280" height="4" fill="url(#gold)"/>
  <text x="40" y="40" fill="#c9a227" font-size="13" letter-spacing="2.6" font-weight="700">14 · REPOSITORY LAYOUT</text>
  <text x="40" y="72" fill="#f4f1e8" font-size="26" font-weight="700">What lives where</text>
  <text x="40" y="96" fill="#c9b98a" font-size="16">Compiler and runtime at the root; libraries, applications and documentation in their own folders.</text>
  
<g class="rise" style="animation-delay:0.00s">
<rect x="40.0" y="124" width="388.0" height="122" rx="12" class="card"/>
<rect x="40.0" y="124" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.00s"/>
<circle cx="66.0" cy="152" r="15" fill="url(#gold)"/><text x="66.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">1</text>
<text x="90.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Compiler &amp; runtime</text>
<text x="58.0" y="186" fill="#c9b98a" font-size="13.5">grammar.lark, algoc.py, algoruntime.py,</text>
<text x="58.0" y="205" fill="#c9b98a" font-size="13.5">algoeval.py, algolsp.py</text>
<text x="414.0" y="234" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">core</text>
</g>
<g class="rise" style="animation-delay:0.08s">
<rect x="446.0" y="124" width="388.0" height="122" rx="12" class="card"/>
<rect x="446.0" y="124" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.12s"/>
<circle cx="472.0" cy="152" r="15" fill="url(#gold)"/><text x="472.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">2</text>
<text x="496.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Trust layer</text>
<text x="464.0" y="186" fill="#c9b98a" font-size="13.5">algotrust.py (privacy, fencing, signing),</text>
<text x="464.0" y="205" fill="#c9b98a" font-size="13.5">algoassure.py (cards, reports, evidence)</text>
<text x="820.0" y="234" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">v0.4</text>
</g>
<g class="rise" style="animation-delay:0.16s">
<rect x="852.0" y="124" width="388.0" height="122" rx="12" class="card"/>
<rect x="852.0" y="124" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.24s"/>
<circle cx="878.0" cy="152" r="15" fill="url(#gold)"/><text x="878.0" y="157" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">3</text>
<text x="902.0" y="157" fill="#f4f1e8" font-size="16" font-weight="700">Engines</text>
<text x="870.0" y="186" fill="#c9b98a" font-size="13.5">algopulse.py (events), algostream.py</text>
<text x="870.0" y="205" fill="#c9b98a" font-size="13.5">(streams), algoquantum.py, algomcp.py</text>
<text x="1226.0" y="234" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">engines</text>
</g>
<g class="rise" style="animation-delay:0.24s">
<rect x="40.0" y="264" width="388.0" height="122" rx="12" class="card"/>
<rect x="40.0" y="264" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.36s"/>
<circle cx="66.0" cy="292" r="15" fill="url(#gold)"/><text x="66.0" y="297" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">4</text>
<text x="90.0" y="297" fill="#f4f1e8" font-size="16" font-weight="700">Modes</text>
<text x="58.0" y="326" fill="#c9b98a" font-size="13.5">algoshell, algostudio, algoprompt.html,</text>
<text x="58.0" y="345" fill="#c9b98a" font-size="13.5">algoagent, the algo command</text>
<text x="414.0" y="374" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">doors</text>
</g>
<g class="rise" style="animation-delay:0.32s">
<rect x="446.0" y="264" width="388.0" height="122" rx="12" class="card"/>
<rect x="446.0" y="264" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.48s"/>
<circle cx="472.0" cy="292" r="15" fill="url(#gold)"/><text x="472.0" y="297" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">5</text>
<text x="496.0" y="297" fill="#f4f1e8" font-size="16" font-weight="700">Libraries &amp; docs</text>
<text x="464.0" y="326" fill="#c9b98a" font-size="13.5">packs/ (120 domain packs), examples/, docs/,</text>
<text x="464.0" y="345" fill="#c9b98a" font-size="13.5">guides, tests/, tools/, CI</text>
<text x="820.0" y="374" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">reuse</text>
</g>
<g class="rise" style="animation-delay:0.40s">
<rect x="852.0" y="264" width="388.0" height="122" rx="12" class="card"/>
<rect x="852.0" y="264" width="388.0" height="122" rx="12" fill="none" stroke="#e9c75a" stroke-width="1.6" class="glow" style="animation-delay:0.60s"/>
<circle cx="878.0" cy="292" r="15" fill="url(#gold)"/><text x="878.0" y="297" fill="#0e2140" font-size="13.5" font-weight="800" text-anchor="middle">6</text>
<text x="902.0" y="297" fill="#f4f1e8" font-size="16" font-weight="700">Applications</text>
<text x="870.0" y="326" fill="#c9b98a" font-size="13.5">enterprise-apps/: ten governed apps with</text>
<text x="870.0" y="345" fill="#c9b98a" font-size="13.5">tools, data, tests and system cards</text>
<text x="1226.0" y="374" fill="#e9c75a" font-size="12" text-anchor="end" class="mono">apps</text>
</g>
  <text x="1240" y="420" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
</svg>
