<use href="#i1" class="wire"/><use href="#i2" class="wire"/><use href="#i3" class="wire"/><use href="#m" class="wire"/><use href="#o1" class="wire" style="stroke:#6cc28a"/><use href="#o2" class="wire"/><use href="#o3" class="wire" style="stroke:#e0705c"/>
<rect x="40" y="152" width="188" height="52" rx="9" class="card"/><text x="58" y="175" fill="#f4f1e8" font-size="15" font-weight="700">Order system</text><text x="58" y="193" fill="#c9b98a" font-size="12">order intents</text>
<rect x="40" y="234" width="188" height="52" rx="9" class="card"/><text x="58" y="257" fill="#f4f1e8" font-size="15" font-weight="700">SIEM / EDR</text><text x="58" y="275" fill="#c9b98a" font-size="12">security alerts</text>
<rect x="40" y="316" width="188" height="52" rx="9" class="card"/><text x="58" y="339" fill="#f4f1e8" font-size="15" font-weight="700">Apps &amp; sensors</text><text x="58" y="357" fill="#c9b98a" font-size="12">claims · tickets · IoT</text>
<text x="40" y="136" fill="#c9a227" font-size="12" letter-spacing="2.4" font-weight="700">PRODUCERS</text>
<rect x="316" y="132" width="280" height="250" rx="12" fill="#0f2547" stroke="#e9c75a" stroke-width="2"/><text x="336" y="160" fill="#e9c75a" font-size="17" font-weight="800">AlgoPulse™ bus</text><text x="336" y="180" fill="#c9b98a" font-size="12">append-only · durable · numbered offsets</text>
<rect x="336" y="196" width="240" height="30" rx="5" fill="#081428"/>
<g><svg x="336" y="196" width="240" height="30" viewBox="336 196 240 30" overflow="hidden"><g class="lane"><rect x="348" y="202" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.95"/><rect x="404" y="202" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.77"/><rect x="460" y="202" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.59"/><rect x="516" y="202" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.41"/><rect x="572" y="202" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.23"/></g></svg></g>
<rect x="336" y="242" width="240" height="30" rx="5" fill="#081428"/>
<g><svg x="336" y="242" width="240" height="30" viewBox="336 242 240 30" overflow="hidden"><g class="lane lane2"><rect x="348" y="248" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.95"/><rect x="404" y="248" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.77"/><rect x="460" y="248" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.59"/><rect x="516" y="248" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.41"/><rect x="572" y="248" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.23"/></g></svg></g>
<rect x="336" y="288" width="240" height="30" rx="5" fill="#081428"/>
<g><svg x="336" y="288" width="240" height="30" viewBox="336 288 240 30" overflow="hidden"><g class="lane lane3"><rect x="348" y="294" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.95"/><rect x="404" y="294" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.77"/><rect x="460" y="294" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.59"/><rect x="516" y="294" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.41"/><rect x="572" y="294" width="44" height="18" rx="3" fill="#e9c75a" fill-opacity="0.23"/></g></svg></g>
<text x="336" y="348" fill="#c9b98a" font-size="12">orders.intent · soc.alerts · …</text><text x="336" y="368" fill="#c9b98a" font-size="12">local folder, or algo pulse serve (token)</text>
<rect x="660" y="132" width="252" height="250" rx="12" fill="#0f2547" stroke="#c9a227" stroke-width="1.6"/><text x="680" y="160" fill="#f4f1e8" font-size="17" font-weight="800">stream block</text><text x="680" y="180" fill="#c9b98a" font-size="12">consumer group · max in flight 8</text><text x="680" y="210" fill="#e8e4d8" font-size="12.5" class="mono">map order = event.order</text><text x="680" y="230" fill="#e8e4d8" font-size="12.5" class="mono">key event.order_id</text><rect x="680" y="246" width="212" height="56" rx="8" fill="#081428" stroke="#c9a227" stroke-opacity=".4"/><text x="692" y="268" fill="#f4f1e8" font-size="13.5" font-weight="700">flow main → agents</text><text x="692" y="288" fill="#c9b98a" font-size="12">policies · budgets · human gate</text><text x="680" y="328" fill="#c9b98a" font-size="12">audit chain + trace per event</text><text x="680" y="348" fill="#c9b98a" font-size="12">dedupe by key · at-least-once</text><text x="680" y="368" fill="#c9b98a" font-size="12">offset committed after results</text>
<rect x="980" y="142" width="260" height="56" rx="10" fill="#0f2547" stroke="#6cc28a" stroke-width="1.6"/><text x="998" y="166" fill="#bff0cd" font-size="15" font-weight="700">orders.decisions</text><text x="998" y="185" fill="#c9b98a" font-size="12">ok · completed decisions</text>
<rect x="980" y="232" width="260" height="56" rx="10" fill="#0f2547" stroke="#e9c75a" stroke-width="1.6"/><text x="998" y="256" fill="#ffe7a3" font-size="15" font-weight="700">orders.review</text><text x="998" y="275" fill="#c9b98a" font-size="12">escalated · a person decides</text>
<rect x="980" y="322" width="260" height="56" rx="10" fill="#0f2547" stroke="#e0705c" stroke-width="1.6"/><text x="998" y="346" fill="#ffc2b6" font-size="15" font-weight="700">orders.dlq</text><text x="998" y="365" fill="#c9b98a" font-size="12">invalid · blocked · failed</text>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.00s" repeatCount="indefinite"><mpath href="#i1"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.50s" repeatCount="indefinite"><mpath href="#i2"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.90s" repeatCount="indefinite"><mpath href="#i3"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.20s" repeatCount="indefinite"><mpath href="#m"/></animateMotion></circle>
<circle r="4.5" fill="#9be7b0" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.00s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle>
<circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.45s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
<circle r="4.5" fill="#ff9a86" filter="url(#soft)"><animateMotion dur="1.3s" begin="0.90s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle>
<text x="40" y="426" fill="#9aa6c2" font-size="13">Nothing to install beyond AlgoLang. The compiler checks every stream (E122): the flow and its inputs exist, mappings read from the event,</text><text x="40" y="444" fill="#9aa6c2" font-size="13">and no result topic is the source topic. Every event ends in exactly one result topic.</text>
  <text x="1240" y="456" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
