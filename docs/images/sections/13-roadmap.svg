<text x="189" y="298" fill="#c9b98a" font-size="13" text-anchor="middle">enterprise, 120</text>
<text x="189" y="315" fill="#c9b98a" font-size="13" text-anchor="middle">packs, SDK</text>
<circle cx="318" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="318" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.3</text>
<line x1="318" y1="204" x2="318" y2="218" stroke="#c9a227" stroke-opacity=".4"/>
<text x="318" y="234" fill="#c9b98a" font-size="13" text-anchor="middle">uncertainty,</text>
<text x="318" y="251" fill="#c9b98a" font-size="13" text-anchor="middle">evals, MCP, LSP</text>
<circle cx="447" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="447" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.3.2–3</text>
<line x1="447" y1="204" x2="447" y2="282" stroke="#c9a227" stroke-opacity=".4"/>
