<text x="962" y="298" fill="#c9b98a" font-size="13" text-anchor="middle">Quantum AI on</text>
<text x="962" y="315" fill="#c9b98a" font-size="13" text-anchor="middle">hardware</text>
<circle cx="1091" cy="190" r="13" fill="#e9c75a" stroke="#e9c75a" stroke-width="2.5"/>
<circle cx="1091" cy="190" r="22" fill="none" stroke="#e9c75a" stroke-width="2" class="pulse"/>
<text x="1091" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.7</text>
<line x1="1091" y1="204" x2="1091" y2="218" stroke="#e9c75a" stroke-opacity=".4"/>
<text x="1091" y="234" fill="#e9c75a" font-size="13" text-anchor="middle">Interoperability</text>
<circle cx="1220" cy="190" r="9" fill="#0e2140" stroke="#8fd3ff" stroke-width="2.5"/>
<text x="1220" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v1.0</text>
<line x1="1220" y1="204" x2="1220" y2="282" stroke="#8fd3ff" stroke-opacity=".4"/>
<text x="1220" y="298" fill="#c9b98a" font-size="13" text-anchor="middle">native runtime,</text>
<text x="1220" y="315" fill="#c9b98a" font-size="13" text-anchor="middle">ecosystem</text>
<circle cx="60" cy="350" r="6" fill="#c9a227"/><text x="72" y="355" fill="#9aa6c2" font-size="13">released</text>
<circle cx="190" cy="350" r="6" fill="#e9c75a"/><text x="202" y="355" fill="#9aa6c2" font-size="13">current</text>
<circle cx="320" cy="350" r="6" fill="#8fd3ff"/><text x="332" y="355" fill="#9aa6c2" font-size="13">next</text>
<circle cx="450" cy="350" r="6" fill="#9aa6c2"/><text x="462" y="355" fill="#9aa6c2" font-size="13">planned</text>
  <text x="1240" y="366" fill="#9aa6c2" fill-opacity=".7" font-size="11" text-anchor="end">AlgoLang · AlgoProfessor AI R&amp;D Solutions</text>
