<text x="447" y="315" fill="#c9b98a" font-size="13" text-anchor="middle">circuits</text>
<circle cx="576" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="576" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.3.4</text>
<line x1="576" y1="204" x2="576" y2="218" stroke="#c9a227" stroke-opacity=".4"/>
<text x="576" y="234" fill="#c9b98a" font-size="13" text-anchor="middle">AlgoPulse™, live</text>
<text x="576" y="251" fill="#c9b98a" font-size="13" text-anchor="middle">figures</text>
<circle cx="704" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="704" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.4</text>
<line x1="704" y1="204" x2="704" y2="282" stroke="#c9a227" stroke-opacity=".4"/>
<text x="704" y="298" fill="#c9b98a" font-size="13" text-anchor="middle">Trustworthy AI,</text>
<text x="704" y="315" fill="#c9b98a" font-size="13" text-anchor="middle">LLM &amp; SLM graphs</text>
<circle cx="833" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="833" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.5</text>
<line x1="833" y1="204" x2="833" y2="218" stroke="#c9a227" stroke-opacity=".4"/>
<text x="833" y="234" fill="#c9b98a" font-size="13" text-anchor="middle">ten large-scale</text>
<text x="833" y="251" fill="#c9b98a" font-size="13" text-anchor="middle">domain apps</text>
<circle cx="962" cy="190" r="9" fill="#c9a227" stroke="#c9a227" stroke-width="2.5"/>
<text x="962" y="164" fill="#f4f1e8" font-size="15" font-weight="800" text-anchor="middle">v0.6</text>
