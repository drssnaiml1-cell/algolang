<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">AlgoLang — the agent-native programming language for trustworthy AI</title>
  <desc id="d">An order event from AlgoPulse flows to Quote and Limits agents in parallel, through a deterministic BREACH guard, to an uncertain RiskGate agent or a Reject agent. Every call is written to a hash-chained audit log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081428"/>
      <stop offset="0.55" stop-color="#0e2140"/>
      <stop offset="1" stop-color="#132c55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c9a227" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#e9c75a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="pEQ" d="M795 150 C 820 150, 815 95, 825 95"/>
    <path id="pEL" d="M795 150 C 820 150, 815 205, 825 205"/>
    <path id="pQG" d="M935 95 C 960 95, 960 150, 982 150"/>
    <path id="pLG" d="M935 205 C 960 205, 960 150, 982 150"/>
    <path id="pGR" d="M1038 150 C 1058 150, 1058 92, 1080 92"/>
    <path id="pGX" d="M1038 150 C 1058 150, 1058 210, 1080 210"/>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .flow { fill: none; stroke: #c9a227; stroke-width: 2; stroke-dasharray: 6 6; animation: dash 1.1s linear infinite; }
    .flow.red { stroke: #e0705c; }
    .node { fill: #0f2547; stroke: #c9a227; stroke-width: 1.6; }
    .node.red { stroke: #e0705c; }
    .lbl { fill: #f4f1e8; font-size: 15px; font-weight: 600; }
    .sub { fill: #c9b98a; font-size: 11.5px; }
    .chip { fill: #c9a227; fill-opacity: 0.12; stroke: #c9a227; stroke-opacity: 0.55; }
    .chiptxt { fill: #f1dc94; font-size: 13px; }
    .blk { fill: #0f2547; stroke: #c9a227; stroke-width: 1.2; opacity: 0; animation: appear 6s ease-in-out infinite; }
    .hash { fill: #e9c75a; font-size: 10.5px; opacity: 0; animation: appear 6s ease-in-out infinite; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; }
    .b4 { animation-delay: 1.5s; } .b5 { animation-delay: 2s; } .b6 { animation-delay: 2.5s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1190px 60px; }
    .meter { animation: meter 4s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes appear { 0%, 8% { opacity: 0; } 18%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes meter { 0% { width: 20px; } 50% { width: 108px; } 100% { width: 20px; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .blk, .hash { opacity: 1; } }
  </style>

  <rect width="1280" height="470" fill="url(#bg)"/>
  <rect width="1280" height="470" fill="url(#grid)"/>
  <rect width="1280" height="470" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#gold)"/>

  <!-- ───────── left: identity ───────── -->
  <g class="sans">
    <text x="56" y="64" fill="#c9a227" font-size="13" letter-spacing="3" font-weight="600">ALGOPROFESSOR AI R&amp;D SOLUTIONS · HYDERABAD</text>
    <text x="54" y="138" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-1.5">Algo<tspan fill="url(#gold)">Lang</tspan></text>
    <text x="56" y="178" fill="#e8e4d8" font-size="25" font-weight="300">The agent-native programming language</text>
    <text x="56" y="210" fill="#e9c75a" font-size="25" font-weight="600">for trustworthy AI</text>
  </g>

  <!-- code card -->
  <g>
    <rect x="56" y="232" width="560" height="132" rx="10" fill="#061024" stroke="#c9a227" stroke-opacity="0.45"/>
    <circle cx="76" cy="250" r="4.5" fill="#e0705c"/><circle cx="92" cy="250" r="4.5" fill="#e9c75a"/><circle cx="108" cy="250" r="4.5" fill="#6cc28a"/>
    <text x="128" y="254" class="mono" fill="#7f8db0" font-size="11.5">pre_trade_check.algo</text>
    <g class="mono" font-size="13.5" xml:space="preserve">
      <text x="74" y="280"><tspan fill="#e9c75a">agent</tspan><tspan fill="#ffffff"> RiskGate</tspan><tspan fill="#c9cfe0">(order: text) -&gt; </tspan><tspan fill="#8fd3ff">uncertain&lt;score&gt;</tspan><tspan fill="#c9cfe0"> {</tspan></text>
      <text x="74" y="300"><tspan dx="33" fill="#e9c75a">policy</tspan><tspan fill="#c9cfe0"> { samples 5  budget cost 0.04 usd }  }</tspan></text>
      <text x="74" y="322"><tspan fill="#e9c75a">if</tspan><tspan fill="#c9cfe0"> limits </tspan><tspan fill="#e9c75a">contains</tspan><tspan fill="#a8e6a1"> "BREACH"</tspan><tspan fill="#c9cfe0"> { emit Reject(order, limits) }</tspan></text>
      <text x="74" y="344"><tspan fill="#e9c75a">stream</tspan><tspan fill="#ffffff"> order_flow</tspan><tspan fill="#c9cfe0"> on main { from </tspan><tspan fill="#e9c75a">pulse</tspan><tspan fill="#a8e6a1"> "market"</tspan><tspan fill="#c9cfe0"> … }</tspan><tspan class="cursor" fill="#e9c75a">▍</tspan></text>
    </g>
  </g>

  <!-- chips -->
  <g class="sans">
    <rect class="chip" x="56" y="384" width="160" height="30" rx="15"/><text class="chiptxt" x="136" y="404" text-anchor="middle">agents, not functions</text>
    <rect class="chip" x="226" y="384" width="140" height="30" rx="15"/><text class="chiptxt" x="296" y="404" text-anchor="middle">policies in code</text>
    <rect class="chip" x="376" y="384" width="118" height="30" rx="15"/><text class="chiptxt" x="435" y="404" text-anchor="middle">human gate</text>
    <rect class="chip" x="504" y="384" width="112" height="30" rx="15"/><text class="chiptxt" x="560" y="404" text-anchor="middle">Pulse · quantum</text>
    <text x="56" y="446" fill="#9aa6c2" font-size="13">Designed by <tspan fill="#f4f1e8" font-weight="600">Dr. S. Satyanarayana</tspan>  ·  <tspan fill="#e9c75a">www.algoprofessor.com</tspan>  ·  Apache 2.0</text>
  </g>

  <!-- ───────── right: a live flow ───────── -->
  <g class="sans">
    <text x="690" y="48" fill="#c9a227" font-size="12" letter-spacing="2.5" font-weight="600">A FLOW, LIVE</text>
    <line x1="690" y1="58" x2="1236" y2="58" stroke="#c9a227" stroke-opacity="0.25"/>

    <use href="#pEQ" class="flow"/><use href="#pEL" class="flow"/>
    <use href="#pQG" class="flow"/><use href="#pLG" class="flow"/>
    <use href="#pGR" class="flow"/><use href="#pGX" class="flow red"/>

    <!-- travelling events -->
    <circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#pEQ"/></animateMotion></circle>
    <circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath href="#pEL"/></animateMotion></circle>
    <circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#pQG"/></animateMotion></circle>
    <circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#pLG"/></animateMotion></circle>
    <circle r="4.5" fill="#ffe08a" filter="url(#soft)"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#pGR"/></animateMotion></circle>
    <circle r="4.5" fill="#ff9a86" filter="url(#soft)"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#pGX"/></animateMotion></circle>

    <!-- event source -->
    <rect x="690" y="128" width="105" height="44" rx="22" class="node"/>
    <circle cx="712" cy="150" r="4" fill="#c9a227"/><circle cx="724" cy="142" r="3" fill="#c9a227" fill-opacity=".7"/><circle cx="724" cy="158" r="3" fill="#c9a227" fill-opacity=".7"/>
    <text x="764" y="147" class="lbl" text-anchor="middle" font-size="13.5">Pulse</text>
    <text x="764" y="162" class="sub" text-anchor="middle">event</text>

    <!-- parallel agents -->
    <rect x="825" y="74" width="110" height="42" rx="9" class="node"/>
    <text x="880" y="93" class="lbl" text-anchor="middle">Quote</text><text x="880" y="108" class="sub" text-anchor="middle">uses market.quote</text>
    <rect x="825" y="184" width="110" height="42" rx="9" class="node"/>
    <text x="880" y="203" class="lbl" text-anchor="middle">Limits</text><text x="880" y="218" class="sub" text-anchor="middle">uses risk.limits</text>
    <text x="880" y="154" fill="#c9a227" font-size="13" text-anchor="middle" font-weight="700">par</text>

    <!-- deterministic guard -->
    <polygon points="1010,122 1038,150 1010,178 982,150" fill="#0f2547" stroke="#e9c75a" stroke-width="1.8"/>
    <text x="1010" y="154" fill="#f4f1e8" font-size="10.5" text-anchor="middle" font-weight="700">guard</text>
    <text x="1010" y="112" class="sub" text-anchor="middle">contains "BREACH"</text>

    <!-- outcomes -->
    <rect x="1080" y="68" width="156" height="48" rx="9" class="node"/>
    <text x="1158" y="88" class="lbl" text-anchor="middle">RiskGate</text>
    <text x="1158" y="104" class="sub" text-anchor="middle">uncertain&lt;score&gt; ×5</text>
    <rect x="1094" y="124" width="128" height="6" rx="3" fill="#1d3866"/>
    <rect x="1094" y="124" width="60" height="6" rx="3" fill="url(#gold)" class="meter"/>
    <text x="1158" y="146" class="sub" text-anchor="middle">confidence</text>
    <g class="pulse"><rect x="1166" y="48" width="70" height="20" rx="10" fill="#c9a227"/><text x="1201" y="62" fill="#0b1a33" font-size="11" font-weight="700" text-anchor="middle">⚑ human</text></g>

    <rect x="1080" y="188" width="156" height="44" rx="9" class="node red"/>
    <text x="1158" y="207" class="lbl" text-anchor="middle">Reject</text>
    <text x="1158" y="222" class="sub" text-anchor="middle">hard limit, no model vote</text>

    <!-- audit chain -->
    <text x="690" y="286" fill="#c9a227" font-size="12" letter-spacing="2.5" font-weight="600">EVERY CALL → HASH-CHAINED AUDIT LOG</text>
    <line x1="690" y1="296" x2="1236" y2="296" stroke="#c9a227" stroke-opacity="0.25"/>
    <g>
      <line x1="745" y1="336" x2="1190" y2="336" stroke="#c9a227" stroke-opacity="0.35" stroke-dasharray="3 5"/>
      <rect class="blk b1" x="690" y="314" width="78" height="44" rx="7"/><text class="hash mono b1" x="729" y="333" text-anchor="middle">Quote</text><text class="hash mono b1" x="729" y="349" text-anchor="middle">#a3f9e1</text>
      <rect class="blk b2" x="783" y="314" width="78" height="44" rx="7"/><text class="hash mono b2" x="822" y="333" text-anchor="middle">Limits</text><text class="hash mono b2" x="822" y="349" text-anchor="middle">#5c0d7b</text>
      <rect class="blk b3" x="876" y="314" width="78" height="44" rx="7"/><text class="hash mono b3" x="915" y="333" text-anchor="middle">Risk·1-5</text><text class="hash mono b3" x="915" y="349" text-anchor="middle">#e21b44</text>
      <rect class="blk b4" x="969" y="314" width="78" height="44" rx="7"/><text class="hash mono b4" x="1008" y="333" text-anchor="middle">Ticket</text><text class="hash mono b4" x="1008" y="349" text-anchor="middle">#09ac3f</text>
      <rect class="blk b5" x="1062" y="314" width="78" height="44" rx="7"/><text class="hash mono b5" x="1101" y="333" text-anchor="middle">review</text><text class="hash mono b5" x="1101" y="349" text-anchor="middle">#77d2c8</text>
      <rect class="blk b6" x="1155" y="314" width="81" height="44" rx="7"/><text class="hash mono b6" x="1195" y="333" text-anchor="middle">approved</text><text class="hash mono b6" x="1195" y="349" text-anchor="middle">#b40e95</text>
    </g>

    <!-- facts -->
    <g font-size="13">
      <text x="690" y="396" fill="#f4f1e8"><tspan fill="#e9c75a" font-weight="700">E100–E133</tspan>  compile-time safety checks</text>
      <text x="690" y="420" fill="#f4f1e8"><tspan fill="#e9c75a" font-weight="700">$ · ₹ · Wh · CO₂</tspan>  priced before every call</text>
      <text x="970" y="396" fill="#f4f1e8"><tspan fill="#e9c75a" font-weight="700">120</tspan> domain packs · <tspan fill="#e9c75a" font-weight="700">22</tspan> enterprise apps</text>
      <text x="970" y="420" fill="#f4f1e8"><tspan fill="#e9c75a" font-weight="700">AlgoPulse</tspan> · <tspan fill="#e9c75a" font-weight="700">quantum</tspan> · <tspan fill="#e9c75a" font-weight="700">MCP</tspan> · <tspan fill="#e9c75a" font-weight="700">eval</tspan> · <tspan fill="#e9c75a" font-weight="700">LSP</tspan></text>
      <text x="690" y="446" fill="#9aa6c2">CLI · Studio · Prompt UI · Python SDK · VS Code</text>
    </g>
  </g>
</svg>
