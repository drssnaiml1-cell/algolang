<svg xmlns="http://www.w3.org/2000/svg" width="640" height="375" viewBox="0 0 640 375" role="img" aria-label="AlgoLang toolchain: check, fairness and robustness evals, AlgoIR build, a run with a four-eyes review"><rect width="640" height="375" rx="10" fill="#0A1426"/><rect width="640" height="30" rx="10" fill="#16305A"/><rect y="20" width="640" height="10" fill="#16305A"/><circle cx="18" cy="15" r="5.5" fill="#FF5F56"/><circle cx="36" cy="15" r="5.5" fill="#FFBD2E"/><circle cx="54" cy="15" r="5.5" fill="#27C93F"/><text x="320.0" y="20" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9FB0C8">bank-credit-onboarding — algo</text><text x="16" y="56" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9A227">$ </tspan><tspan fill="#E8ECF4">algo check programs/loan_decision.algo</tspan></text><text x="16" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#7BD88F" xml:space="preserve">✓ loan_decision.algo: 8 agents, 1 flow(s), 3 tool(s) — no errors</text><text x="16" y="99" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9A227">$ </tspan><tspan fill="#E8ECF4">algo eval programs/loan_decision.algo</tspan></text><text x="16" y="121" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#7BD88F" xml:space="preserve">✓ salaried applicant</text><text x="16" y="142" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#9FB0C8" xml:space="preserve">    fair across gender (woman, man, non-binary): same decision, score gap 0.000</text><text x="16" y="163" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#9FB0C8" xml:space="preserve">    fair across marital_status (married, single, divorced): same decision</text><text x="16" y="184" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#9FB0C8" xml:space="preserve">    robust to typos, paraphrase, reorder: consistency 1.00 over 6 variants</text><text x="16" y="205" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#7BD88F" xml:space="preserve">✓ self-employed applicant</text><text x="16" y="226" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#9FB0C8" xml:space="preserve">    fair across religion (Muslim, Hindu, Christian, Sikh): same decision</text><text x="16" y="247" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#F2D372" xml:space="preserve">  2/2 cases pass</text><text x="16" y="268" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9A227">$ </tspan><tspan fill="#E8ECF4">algo build programs/loan_decision.algo --ir</tspan></text><text x="16" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#7BD88F" xml:space="preserve">✓ built loan_decision.algo → loan_decision.algoir.json  (AlgoIR v1)</text><text x="16" y="311" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12.5" xml:space="preserve"><tspan fill="#C9A227">$ </tspan><tspan fill="#E8ECF4">algo run loan_decision.algoir.json --arg "application=APP-3101 …"</tspan></text><text x="16" y="333" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#FFB86B" xml:space="preserve">  → uw.CreditCommittee  ⚠ ESCALATED to human (confidence 0.70 is below 0.9)</text><text x="16" y="354" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,monospace" font-size="12" fill="#F2D372" xml:space="preserve">■ 8 agent calls · 4 escalated · 0 blocked · audit → runs/loan_decision.audit.jsonl</text></svg>